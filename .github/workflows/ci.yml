name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Style check
        run: ./gradlew spotlessCheck
      - name: Build
        run: ./gradlew :core:assemble :app:assembleDebug
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest
      # 24a: every check HoldingsScaleTest measured again, each try, also when the tests pass.
      - name: Scale test retries
        if: always()
        run: |
          sed -n '/^Checks measured again/,$p' core/build/scale/holdings-scale-after.txt 2>/dev/null || echo "No scale table: HoldingsScaleTest did not run."
      - name: Lint
        run: ./gradlew :app:lintDebug