name: Screen tests

# AC-61 (CR3, iteration 15b; measured in plan/spikes/screen-tests.md, section 11): the screen tests on an Android 17 emulator,
# on every pull request and on main after each merge. A red run is not merged.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: system-images;android-37.0;google_apis;x86_64
  AVD: ats-screen-tests-37
  # The fixed throwaway test PIN (spec section 9; plan/spikes/screen-tests.md 11.3, S10), the same as TEST_PIN in ScreenTestSupport.kt.
  # It unlocks only this emulator, never a phone.
  TEST_PIN: "135790"
  # plan/spikes/two-emulators.md section 8 (throw-away-two-emulators only): the emulators' serials, one per port (5554, 5556),
  # and the cores and memory each emulator gets. Series C (T3's follow-up after run B1 broke H3): two emulators with 2 cores
  # and 3,072 MB each.
  SERIALS: emulator-5554 emulator-5556
  CORES: "2"
  MEMORY: "3072"

jobs:
  screen-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Give the job access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Look up the emulator and image versions
        id: versions
        run: |
          list=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null)
          emulator=$(echo "$list" | awk -F'|' '{n=$1; gsub(/ /,"",n)} n=="emulator" {gsub(/ /,"",$2); print $2}' | sort -V | tail -1)
          image=$(echo "$list" | awk -F'|' -v p="$IMAGE" '{n=$1; gsub(/ /,"",n)} n==p {gsub(/ /,"",$2); print $2}' | sort -V | tail -1)
          if [ -z "$emulator" ] || [ -z "$image" ]; then echo "::error::emulator '$emulator' or image '$image' not found"; exit 1; fi
          echo "Emulator $emulator, image revision $image"
          echo "sdk=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
          echo "key=emulator-$emulator-android-37.0-google_apis-x86_64-$image" >> "$GITHUB_OUTPUT"

      - name: Restore the emulator and image
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.versions.outputs.sdk }}/emulator
            ${{ steps.versions.outputs.sdk }}/system-images/android-37.0/google_apis/x86_64
          key: ${{ steps.versions.outputs.key }}

      - name: Install the emulator and image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          start=$SECONDS
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator "$IMAGE"
          echo "Install took $((SECONDS - start)) s"

      - name: Check the emulator and image are in place
        run: |
          test -x "$ANDROID_HOME/emulator/emulator"
          test -f "$ANDROID_HOME/system-images/android-37.0/google_apis/x86_64/system.img"
          grep Pkg.Revision "$ANDROID_HOME/emulator/source.properties" "$ANDROID_HOME/system-images/android-37.0/google_apis/x86_64/source.properties"
          du -sh "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images/android-37.0/google_apis/x86_64"
          df -h "$HOME"
          echo "CPUs: $(nproc)"; free -m

      - name: Save the emulator and image
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.versions.outputs.sdk }}/emulator
            ${{ steps.versions.outputs.sdk }}/system-images/android-37.0/google_apis/x86_64
          key: ${{ steps.versions.outputs.key }}

      # Before the emulator starts, not beside it: sharing the runner's CPUs, the boot and the build both slowed down and
      # Android's own system process stopped responding (plan/spikes/screen-tests.md 11.6, run 8 on 87d0a2f).
      - name: Build the app and the tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      # plan/spikes/two-emulators.md section 8, step 1 (throw-away-two-emulators only; taken from plan/spikes/avd-memory.md,
      # commit 161a322): every 30 s, the runner's available memory and each guest's MemAvailable, from before the emulators
      # start to the end of the tests. Before a guest boots its field stays empty.
      - name: Start the memory sampler
        run: |
          cat > "$RUNNER_TEMP/sample-memory.sh" <<'EOF'
          adb="$ANDROID_HOME/platform-tools/adb"
          while true; do
            line="$(date +%s) runner_available_mb=$(free -m | awk '/^Mem:/ {print $7}')"
            for s in $SERIALS; do
              a=$("$adb" -s "$s" shell cat /proc/meminfo 2>/dev/null | tr -d '\r' | awk '/^MemAvailable:/ {print $2}')
              line="$line guest_available_kb@$s=$a"
            done
            echo "$line"
            sleep 30
          done
          EOF
          nohup bash "$RUNNER_TEMP/sample-memory.sh" > memory-samples.txt 2>&1 &
          echo "SAMPLER_PID=$!" >> "$GITHUB_ENV"

      # One AVD per serial: two emulators cannot run from one AVD at once (my reading). All start together; BOOT_START is
      # the start of the first (plan/spikes/two-emulators.md section 6, criterion 1).
      - name: Create the AVDs and start them headless
        run: |
          # The same folder for avdmanager and the emulator (plan/spikes/screen-tests.md 11.6, run 1: the emulator found no AVD in $HOME/.android/avd).
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "BOOT_START=$(date +%s)" >> "$GITHUB_ENV"
          pids=""
          for s in $SERIALS; do
            port=${s#emulator-}; avd="$AVD-$port"
            echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n "$avd" -k "$IMAGE" -d pixel_9_pro_xl
            if [ ! -f "$ANDROID_AVD_HOME/$avd.ini" ]; then
              echo "::error::avdmanager made no $avd.ini in $ANDROID_AVD_HOME"; find "$HOME" -name "$avd.ini" 2>/dev/null; exit 1
            fi
            # 4 GB: with the profile's 2 GB, System UI stopped responding during the tests (plan/spikes/screen-tests.md 11.6, run 1 on 039611f).
            nohup "$ANDROID_HOME/emulator/emulator" -avd "$avd" -port "$port" -no-window -no-audio -no-boot-anim -no-snapshot \
              -gpu swiftshader_indirect -accel on -memory "$MEMORY" -cores "$CORES" > "emulator-$port.log" 2>&1 &
            pids="$pids $!"
            echo "Started $s ($avd) with $CORES cores and $MEMORY MB"
          done
          echo "EMULATOR_PIDS=$pids" >> "$GITHUB_ENV"

      - name: Wait for the boot
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          for s in $SERIALS; do
            until [ "$("$adb" -s "$s" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
              for p in $EMULATOR_PIDS; do
                if ! kill -0 "$p" 2>/dev/null; then echo "::error::an emulator exited"; tail -50 emulator-*.log; exit 1; fi
              done
              if [ $(($(date +%s) - BOOT_START)) -gt 600 ]; then echo "::error::$s did not boot in 600 s"; tail -50 emulator-*.log; exit 1; fi
              sleep 2
            done
            echo "$s booted $(($(date +%s) - BOOT_START)) s after the emulators' start"
          done

      - name: Let the system settle
        run: |
          # Waits until no "Not Responding" window has been seen on any emulator for 10 s (up to 120 s). Back closes such a
          # dialog as Wait would (my reading).
          adb="$ANDROID_HOME/platform-tools/adb"
          start=$(date +%s); quiet_since=$start
          while [ $(($(date +%s) - quiet_since)) -lt 10 ]; do
            if [ $(($(date +%s) - start)) -gt 120 ]; then
              echo "::error::the system did not settle in 120 s"
              for s in $SERIALS; do echo "$s:"; "$adb" -s "$s" shell dumpsys window | grep -E 'mCurrentFocus|Not Responding'; done
              exit 1
            fi
            for s in $SERIALS; do
              if "$adb" -s "$s" shell dumpsys window | grep -q 'Not Responding'; then
                echo "$s: Not Responding window at $(($(date +%s) - start)) s"; "$adb" -s "$s" shell input keyevent KEYCODE_BACK; quiet_since=$(date +%s)
              fi
            done
            sleep 2
          done
          echo "Settled after $(($(date +%s) - start)) s"

      - name: Animations off and the test PIN set
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          for s in $SERIALS; do
            "$adb" -s "$s" shell settings put global window_animation_scale 0
            "$adb" -s "$s" shell settings put global transition_animation_scale 0
            "$adb" -s "$s" shell settings put global animator_duration_scale 0
            "$adb" -s "$s" shell locksettings set-pin "$TEST_PIN"
            "$adb" -s "$s" shell locksettings verify --old "$TEST_PIN"
          done

      # plan/spikes/two-emulators.md section 7, T2 (throw-away-two-emulators only): one Gradle run per emulator, all at once,
      # each on the emulator ANDROID_SERIAL names and with its own half of the tests (numShards, shardIndex). Each run's
      # output goes to gradle-<serial>.log; its last lines are printed here.
      - name: Screen tests
        run: |
          echo "TESTS_START=$(date +%s)" >> "$GITHUB_ENV"
          start=$SECONDS
          n=$(echo $SERIALS | wc -w); i=0; pids=""
          for s in $SERIALS; do
            (
              t0=$(date +%s)
              rc=0
              ANDROID_SERIAL="$s" ./gradlew :app:connectedDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.numShards="$n" \
                -Pandroid.testInstrumentationRunnerArguments.shardIndex="$i" > "gradle-$s.log" 2>&1 || rc=$?
              echo "half $i ($s): exit $rc, ran from $((t0 - BOOT_START)) s to $(($(date +%s) - BOOT_START)) s after the emulators' start"
              exit $rc
            ) &
            pids="$pids $!"
            i=$((i + 1))
          done
          rc=0
          for p in $pids; do wait "$p" || rc=1; done
          for s in $SERIALS; do echo "--- gradle-$s.log, last 30 lines"; tail -30 "gradle-$s.log"; done
          echo "Tests took $((SECONDS - start)) s"
          # plan/spikes/two-emulators.md section 6, criterion 1.
          echo "Emulators' start to tests done: $(($(date +%s) - BOOT_START)) s"
          exit $rc

      # Gradle once passed with no test run (plan/spikes/screen-tests.md 11.4, series 1, run 20). The expected count is the number of @Test lines in
      # the screen tests' sources, so it needs no update when tests are added; a stray @Test makes the run red, never green.
      - name: Check the test count
        if: always()
        run: |
          expected=$(grep -rhE '^[[:space:]]*@Test\b' app/src/androidTest | wc -l)
          dir=app/build/outputs/androidTest-results/connected/debug
          count=$(find "$dir" -name 'TEST-*.xml' -exec grep -ho '<testcase ' {} + 2>/dev/null | wc -l)
          echo "Tests run: $count of $expected"
          if [ "$expected" -eq 0 ]; then echo "::error::no @Test found in app/src/androidTest"; exit 1; fi
          if [ "$count" -lt "$expected" ]; then echo "::error::$count tests ran, expected $expected"; exit 1; fi
          # plan/spikes/two-emulators.md section 6, H1 (throw-away-two-emulators only): each half's file, and no test in two halves.
          find "$dir" -name 'TEST-*.xml' | while read -r f; do echo "$(basename "$f"): $(grep -o '<testcase ' "$f" | wc -l) tests"; done
          twice=$(find "$dir" -name 'TEST-*.xml' -exec grep -ho '<testcase name="[^"]*" classname="[^"]*"' {} + | sort | uniq -d | wc -l)
          echo "Tests in more than one half: $twice"
          if [ "$twice" -gt 0 ]; then echo "::error::$twice tests ran in more than one half"; exit 1; fi

      - name: Pull the screenshots of failed unlocks
        if: always()
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          for s in $SERIALS; do
            mkdir -p "unlock-screens/$s"
            for f in $("$adb" -s "$s" shell 'ls /data/local/tmp/screen-test-*.png 2>/dev/null' | tr -d '\r'); do "$adb" -s "$s" pull "$f" "unlock-screens/$s/"; done
          done
          ls -lR unlock-screens

      # plan/spikes/two-emulators.md section 6, H2 and H3 (throw-away-two-emulators only; taken from plan/spikes/avd-memory.md,
      # commit 161a322): the lowest of each sampled figure, over the whole job and during the tests, and each guest's
      # low-memory and kill events still in its events buffer.
      - name: Memory summary
        if: always()
        run: |
          kill "$SAMPLER_PID" 2>/dev/null || true
          adb="$ANDROID_HOME/platform-tools/adb"
          echo "Samples: $(wc -l < memory-samples.txt)"
          awk -v ts="${TESTS_START:-0}" '
            { for (i = 2; i <= NF; i++) {
                n = index($i, "="); k = substr($i, 1, n - 1); x = substr($i, n + 1)
                if (x == "") continue
                x += 0
                if (!(k in lowjob) || x < lowjob[k]) lowjob[k] = x
                if (ts > 0 && $1 >= ts && (!(k in lowtests) || x < lowtests[k])) lowtests[k] = x
            } }
            END { for (k in lowjob) print k ", lowest: " lowjob[k] " (job), " ((k in lowtests) ? lowtests[k] : "-") " (tests)" }' memory-samples.txt
          for s in $SERIALS; do
            "$adb" -s "$s" logcat -b events -d 2>/dev/null | grep -E 'am_low_memory|am_kill' > "memory-events-$s.txt" || true
            echo "$s: am_low_memory events $(grep -c am_low_memory "memory-events-$s.txt" || true), am_kill events $(grep -c am_kill "memory-events-$s.txt" || true)"
          done

      - name: Keep the results and the emulator log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen-tests-attempt-${{ github.run_attempt }}
          path: |
            app/build/outputs/androidTest-results/connected/debug/
            app/build/reports/androidTests/connected/debug/
            emulator-*.log
            unlock-screens/
            memory-samples.txt
            memory-events-*.txt
            gradle-*.log
          retention-days: 7
